name: RRM Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1

jobs:
  lint_and_format:
    name: Stage 1 — Check, Format, and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (Nightly untuk SIMD)
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Pastikan toolchain mendukung versi proyek Anda
          toolchain: nightly-2026-04-15
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rrm-rust-ci"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: cargo clippy (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Stage 2 — Test (Release Mode)
    runs-on: ubuntu-latest
    needs: lint_and_format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-15

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rrm-rust-ci"

      # Penggunaan --release diwajibkan oleh protokol performa proyek
      - name: cargo test --release
        run: cargo test --release --all-features

  benchmark:
    name: Stage 3 — Benchmark & Regression Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-15
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Run topology benchmark
        run: |
          cargo run --release --bin bench_topology | tee benchmark_output.txt
          
      - name: Check regression
        run: |
          CURRENT=$(grep "Average time for n=500:" benchmark_output.txt | awk '{print $5}')
          # Script pembanding baseline letakkan di sini

